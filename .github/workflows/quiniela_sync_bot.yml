name: Quiniela Master Pro - Bot Multi-Fuente 24/7

on:
  schedule:
    # Corre cada 5 min de 10:00 a 23:30 Argentina (UTC-3)
    # 13:00-23:59 UTC = 10:00-20:59 Argentina
    - cron: '*/5 13-23 * * *'
    # 00:00-02:59 UTC = 21:00-23:59 Argentina (cubre Nocturna de 21hs)
    - cron: '*/5 0-2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_quiniela:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Multi-Source Scraper (LOTBA + JugandoOnline + Clarin/LaNacion)
        run: |
          python backend/scraper_service.py

      - name: Copy draws.json to Frontend Public API
        run: |
          mkdir -p frontend/public/api
          cp backend/real_draws_dump.json frontend/public/api/draws.json

      # Live results are served on demand by quinelaOfficialDraws.
      # This workflow maintains the independent GitHub archive fallback.
      # Do not deploy a partial/stale site or hide deployment errors here.

      - name: Commit & Push Updated Draws Database
        run: |
          git config --global user.name 'Quiniela Sync Bot'
          git config --global user.email 'bot@ingenieriajh.com'
          git add backend/real_draws_dump.json backend/quiniela.db frontend/public/api/draws.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Bot: Actualizacion automatica de resultados [skip ci]" && git push)

